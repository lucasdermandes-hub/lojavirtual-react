# Configuração do deploy no Netlify (projeto Vite + React Router).
#
# No Netlify: Base directory = "loja-react"  |  Publish directory = "dist"
# (o arquivo abaixo passa a valer automaticamente nos dois campos).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Cache longo para os arquivos com hash gerados pelo Vite.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fallback de SPA: o React Router (BrowserRouter) resolve as rotas
# (/produtos, /carrinho, /pagamento, /produtos/:id...) no cliente.
# Sem isso, qualquer URL direta ou F5 devolve o 404 do Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
